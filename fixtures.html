<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Enhanced Splash Screen Styles -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    }
    
    @keyframes float {
      0% { transform: translateY(0) translateZ(0); }
      50% { transform: translateY(-10px) translateZ(0); }
      100% { transform: translateY(0) translateZ(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(0.98) translateZ(0); opacity: 0.9; }
      50% { transform: scale(1.02) translateZ(0); opacity: 1; }
    }
    
    @keyframes shine {
      to { background-position: 200% center; }
    }
    
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      overflow: hidden;
      will-change: opacity, visibility;
    }
    
    @media (prefers-reduced-motion: no-preference) {
      #splash-screen {
        background: linear-gradient(-45deg, #0a192f, #112240, #1a3a5f, #0a192f);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }
    }
    
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-20px);
    }
    
    .splash-content {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }
    
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 2rem;
      transform: translateZ(0);
      will-change: transform;
    }
    
    @media (prefers-reduced-motion: no-preference) {
      .splash-logo {
        animation: float 6s ease-in-out infinite, pulse 3s ease-in-out infinite;
      }
    }
    
    .splash-title {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin: 1.5rem 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      background: linear-gradient(90deg, #fff, #00e0ff, #00a8ff, #fff);
      background-size: 200% auto;
      color: #000;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    @media (prefers-reduced-motion: no-preference) {
      .splash-title {
        animation: shine 3s linear infinite;
      }
    }
    
    .splash-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.2rem;
      margin-bottom: 2rem;
      font-weight: 400;
    }
    
    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 2rem auto;
      position: relative;
    }
    
    .loading-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e0ff, #00a8ff);
      transition: width 0.3s ease;
    }
    
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
    
    @media (max-width: 768px) {
      .splash-logo {
        width: 140px;
        height: 140px;
      }
      
      .splash-title {
        font-size: 2rem;
      }
      
      .splash-subtitle {
        font-size: 1rem;
      }
    }
  </style>

  <title>Fixtures & Schedule - DVP Cricket</title>
  <style>
    :root {
      --primary: #00e0ff;
      --primary-dark: #00b4d8;
      --secondary: #ff6b6b;
      --accent: #ffd166;
      --primary-gradient: linear-gradient(135deg, #00e0ff 0%, #00a8ff 100%);
      --bg1: #0a192f;
      --bg2: #112240;
      --text-light: rgba(255, 255, 255, 0.9);
      --text-lighter: rgba(255, 255, 255, 0.7);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --bg2: #0a0f1a;
      --text: #e6f1ff;
      --text-muted: #b8c1ec;
      --card: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.08);
      --success: #2ecc71;
      --danger: #ff4757;
      --warning: #ff9f43;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a192f;
      color: #e6f1ff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    a { color: var(--primary); text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 100px 20px 40px; }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: rgba(10, 25, 47, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: var(--transition);
    }
    
    header.scrolled {
      padding: 10px 22px;
      background: rgba(10, 25, 47, 0.95);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .brand h1 { font-size: 18px; font-weight: 600; color: var(--primary); letter-spacing: .3px; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transform: translateZ(0);
      will-change: transform;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
      opacity: 0;
      transition: var(--transition);
      z-index: -1;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      background: rgba(255, 255, 255, 0.1);
    }
    
    .btn:hover::before {
      opacity: 1;
    }
    
    .btn-primary {
      background: var(--primary-gradient);
      color: #0a192f;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 224, 255, 0.3);
      transform: translateZ(0);
      will-change: transform;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 224, 255, 0.4);
      background: linear-gradient(135deg, #00d0ff 0%, #0098ff 100%);
    }

    /* Page title */
    .page-header { text-align: center; margin-bottom: 26px; }
    .page-title { font-size: 34px; line-height: 1.2; margin-bottom: 8px; }
    .page-subtitle { color: var(--muted); font-size: 15px; }

    /* Filters */
    .filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 26px 0 18px; }
    .input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.05); color: var(--text); outline: none; font-size: 14px;
    }
    .input::placeholder { color: #9aa6c7; }

    /* Fixtures */
    .fixtures-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translateZ(0);
      will-change: transform;
    }
    
    .fixtures-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: rgba(0, 224, 255, 0.2);
    }
    .fixtures-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.12); padding-bottom: 10px; margin-bottom: 12px; }
    .fixtures-header h3 { font-size: 16px; font-weight: 600; }
    .fixtures-list { display: grid; gap: 10px; }

    .fixture-date {
      padding: 10px 20px;
      background: linear-gradient(90deg, rgba(0, 224, 255, 0.1) 0%, rgba(0, 224, 255, 0.05) 100%);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.95rem;
      border-left: 4px solid var(--primary);
      margin: 20px 0 10px;
      border-radius: 0 6px 6px 0;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
      will-change: transform;
    }
    
    .fixture-date::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.1) 100%);
      transform: translateX(-100%);
      transition: var(--transition);
    }
    
    .fixture-date:hover::after {
      transform: translateX(100%);
    }

    .fixtures-list .fixture {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      margin: 8px 0;
      transition: var(--transition);
      box-sizing: border-box;
      width: 100%;
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
      will-change: transform;
    }
    
    .fixture::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0, 224, 255, 0.03) 0%, transparent 100%);
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
    }
    
    .fixture:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(0, 224, 255, 0.2);
      box-shadow: var(--shadow-sm);
    }
    
    .fixture:hover::before {
      opacity: 1;
    }

    .fixture.live {
      border-left: 4px solid var(--danger);
      background: linear-gradient(90deg, rgba(255, 71, 87, 0.08) 0%, rgba(255, 71, 87, 0.03) 100%);
      animation: pulse-border 2s infinite;
    }
    
    @keyframes pulse-border {
      0% { border-left-color: var(--danger); }
      50% { border-left-color: rgba(255, 71, 87, 0.5); }
      100% { border-left-color: var(--danger); }
    }

    .fixture-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      text-align: center;
      min-width: 0; /* Allows text truncation to work */
    }

    .team-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease;
      transform: translateZ(0);
      will-change: transform;
    }

    .team-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--bg1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .team-name {
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-word;
    }

    .vs {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
      padding: 0 12px;
    }

    .fixture-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      gap: 8px;
    }

    .fixture-time, .fixture-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-badge {
      background: #ff4757;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: 600;
      margin-left: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .team .badge { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.12); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--primary); }
    .team .name { font-weight: 600; }
    .vs { text-align: center; color: #9aa6c7; font-weight: 600; }
    .time, .venue { color: var(--muted); font-size: 13px; }

    /* Empty state */
    .empty {
      text-align: center; padding: 40px 20px; color: var(--muted);
      background: var(--card); border: 1px dashed var(--card-border); border-radius: 14px;
    }

    /* Table on desktop */
    @media (min-width: 900px) {
      .fixtures-list.header { display: grid; grid-template-columns: 1.2fr 0.6fr 1.2fr 0.8fr 0.8fr; gap: 10px; margin-bottom: 6px; color: #9aa6c7; font-size: 12px; }
      .fixtures-list.header > div { padding: 6px 8px; }
    }

    /* Mobile cards */
    /* Mobile Styles */
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 80px 12px 30px;
      }
      
      .team-logo {
        width: 50px;
        height: 50px;
        margin-right: 15px;
      }
      
      .vs {
        margin: 0 15px;
        padding: 5px 15px;
        font-size: 1.2rem;
      }
      
      .fixture-card {
        padding: 20px 15px;
      }
      
      .page-title {
        font-size: 24px;
        margin-bottom: 4px;
      }
      
      .page-subtitle {
        font-size: 14px;
      }
      
      .fixtures-card {
        padding: 12px;
        border-radius: 12px;
      }
      
      .fixtures-header h3 {
        font-size: 18px;
      }
      
      .fixture {
        padding: 14px 12px;
        margin: 6px 0;
      }
      
      .team-badge {
        width: 36px;
        height: 36px;
        font-size: 12px;
      }
      
      .team-name {
        font-size: 14px;
        max-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      
      .vs {
        font-size: 14px;
        padding: 0 8px;
      }
      
      .fixture-details {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding-top: 10px;
      }
      
      .fixture-time, .fixture-group {
        width: 100%;
        justify-content: space-between;
        padding: 4px 0;
      }
      
      .live-badge {
        font-size: 11px;
        padding: 1px 6px;
        margin-left: auto;
      }
      
      .fixture-date {
        margin: 12px 0 6px;
        padding: 8px 12px;
        font-size: 14px;
      }
      
      /* Hide desktop header on mobile */
      .fixtures-list.header {
        display: none;
      }
      
      /* Adjust header for mobile */
      header {
        padding: 10px 16px;
      }
      
      .brand h1 {
        font-size: 16px;
      }
      
      .btn {
        padding: 8px 12px;
        font-size: 13px;
      }
    }
    
    /* Small mobile devices */
    @media (max-width: 400px) {
      .team-name {
        max-width: 100px;
        font-size: 13px;
      }
      
      .vs {
        font-size: 13px;
        padding: 0 6px;
      }
      
      .fixture {
        padding: 12px 10px;
      }
      
      .fixture-time span,
      .fixture-group span {
        font-size: 12px;
      }
    }

    /* Knockout Bracket */
    .bracket-wrap { margin-top: 40px; position: relative; }
    .bracket-title { text-align: center; margin: 10px 0 8px; font-size: 26px; font-weight: 700; }
    .bracket-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }

    .bracket-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 12px; }
    .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }

    .bracket {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .round { display: grid; gap: 16px; align-content: start; }
    .round h4 { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
    .match {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 10px;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .match:hover { border-color: rgba(0,224,255,0.35); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .group-tag {
      position: absolute;
      top: 6px; right: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 224, 255, 0.15);
      border: 1px solid rgba(0, 224, 255, 0.35);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
    }
    .seed { display: grid; grid-template-columns: auto 1fr 52px; align-items: center; gap: 8px; font-size: 13px; }
    .seed .tag { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.08); color: var(--primary); font-weight: 700; font-size: 12px; }
    .seed .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seed .score { color: var(--muted); font-weight: 600; text-align: right; }
    .seed input.score-input {
      width: 52px; height: 28px; padding: 2px 6px; border-radius: 8px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      outline: none; text-align: right; font-weight: 600;
    }
    .seed input.score-input:focus { border-color: rgba(0,224,255,0.5); box-shadow: 0 0 0 2px rgba(0,224,255,0.12); }

    .seed.winner { background: rgba(0, 224, 255, 0.08); border-radius: 8px; }

    .group-header {
      text-align: left;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .4px;
      margin: 6px 2px 2px;
      opacity: .9;
    }

    /* connectors (desktop) */
    @media (min-width: 900px) {
      .round { position: relative; }
      .round:not(:last-child) .match::after { /* horizontal line to next column */
        content: '';
        position: absolute;
        right: -9px; top: 50%; width: 9px; height: 1px;
        background: rgba(255,255,255,0.2);
      }
    }

    /* Responsive tweaks */
    @media (max-width: 899px) {

  <script>
    // Optimized animation frame handling
    const requestFrame = (function() {
      return window.requestAnimationFrame || 
             window.webkitRequestAnimationFrame || 
             window.mozRequestAnimationFrame || 
             function(callback) { window.setTimeout(callback, 1000 / 60); };
    })();
    
    // Check for reduced motion preference
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    
    // Optimized scroll handling
    let ticking = false;
    
    function onScroll() {
      if (!ticking) {
        requestFrame(updateOnScroll);
        ticking = true;
      }
    }

    // Group teams by their groups
    const teamsByGroup = allTeams.reduce((acc, team) => {
      if (!acc[team.group]) acc[team.group] = [];
      acc[team.group].push(team.name);
      return acc;
    }, {});

    const BRACKET = [
      // Round of 16 (Left 8 + Right 8)
      [
        // Group A (top-left under badge A)
        { a: { name: teamsByGroup['Group A']?.[0] || 'TBD', score: '' }, b: { name: teamsByGroup['Group A']?.[1] || 'TBD', score: '' }, group: 'Group A' },
        { a: { name: teamsByGroup['Group A']?.[2] || 'TBD', score: '' }, b: { name: teamsByGroup['Group A']?.[3] || 'TBD', score: '' }, group: 'Group A' },
        // Group B (bottom-left under badge B)
        { a: { name: teamsByGroup['Group B']?.[0] || 'TBD', score: '' }, b: { name: teamsByGroup['Group B']?.[1] || 'TBD', score: '' }, group: 'Group B' },
        { a: { name: teamsByGroup['Group B']?.[2] || 'TBD', score: '' }, b: { name: teamsByGroup['Group B']?.[3] || 'TBD', score: '' }, group: 'Group B' },
        // Group C (top-right under badge C)
        { a: { name: teamsByGroup['Group C']?.[0] || 'TBD', score: '' }, b: { name: teamsByGroup['Group C']?.[1] || 'TBD', score: '' }, group: 'Group C' },
        { a: { name: teamsByGroup['Group C']?.[2] || 'TBD', score: '' }, b: { name: teamsByGroup['Group C']?.[3] || 'TBD', score: '' }, group: 'Group C' },
        // Group D (bottom-right under badge D)
        { a: { name: teamsByGroup['Group D']?.[0] || 'TBD', score: '' }, b: { name: teamsByGroup['Group D']?.[1] || 'TBD', score: '' }, group: 'Group D' },
        { a: { name: teamsByGroup['Group D']?.[2] || 'TBD', score: '' }, b: { name: teamsByGroup['Group D']?.[3] || 'TBD', score: '' }, group: 'Group D' },
      ],
      // Quarterfinals (8)
      new Array(8/2).fill(0).map(()=>({ a:{name:'TBD',score:''}, b:{name:'TBD',score:''} })),
      // Semifinals (4)
      new Array(4/2).fill(0).map(()=>({ a:{name:'TBD',score:''}, b:{name:'TBD',score:''} })),
      // Final (2)
      [{ a:{name:'TBD',score:''}, b:{name:'TBD',score:''} }],
      // Champion (1) - use single box for winner
      [{ a:{name:'Champion',score:''}, b:{name:'',score:''} }],
    ];

    function winnerFromScores(m) {
      const a = parseFloat(m.a?.score);
      const b = parseFloat(m.b?.score);
      if (!isFinite(a) || !isFinite(b)) return null;
      return a === b ? null : (a > b ? m.a?.name : m.b?.name);
    }

    function computeNextRounds(data) {
      // Build QF from R16 winners (left 4 -> 2, right 4 -> 2)
      const r16 = data[0] || [];
      const qf  = data[1] || [{},{},{},{}].map(()=>({ a:{}, b:{} }));
      const sf  = data[2] || [{},{}].map(()=>({ a:{}, b:{} }));
      const fin = (data[3] && data[3][0]) || { a:{}, b:{} };
      const win = (data[4] && data[4][0]) || { a:{name:'Champion'}, b:{} };

      const getW = i => winnerFromScores(r16[i]) || r16[i]?.winner || '';
      // QF Left
      if (r16[0] && r16[1]) qf[0] = { a:{ name:getW(0) }, b:{ name:getW(1) } };
      if (r16[2] && r16[3]) qf[1] = { a:{ name:getW(2) }, b:{ name:getW(3) } };
      // QF Right
      if (r16[4] && r16[5]) qf[2] = { a:{ name:getW(4) }, b:{ name:getW(5) } };
      if (r16[6] && r16[7]) qf[3] = { a:{ name:getW(6) }, b:{ name:getW(7) } };

      const getWQ = i => winnerFromScores(qf[i]) || qf[i]?.winner || '';
      // SF
      if (qf[0] && qf[1]) sf[0] = { a:{ name:getWQ(0) }, b:{ name:getWQ(1) } };
      if (qf[2] && qf[3]) sf[1] = { a:{ name:getWQ(2) }, b:{ name:getWQ(3) } };

      const getWS = i => winnerFromScores(sf[i]) || sf[i]?.winner || '';
      // Final
      const fA = getWS(0); const fB = getWS(1);
      fin.a = { name: fA };
      fin.b = { name: fB };

      // Winner
      const finalWinner = winnerFromScores(fin) || fin.winner || '';
      win.a = { name: finalWinner || (fA && fB ? 'Champion' : 'Champion') };

      data[1] = qf; data[2] = sf; data[3] = [fin]; data[4] = [win];
      return data;
    }

    function attachClickToPick(card, match) {
      // Allow click on A or B line to pick a winner when scores are not present
      const seeds = card.querySelectorAll('.seed');
      seeds.forEach((seed, idx) => {
        seed.style.cursor = 'pointer';
        seed.addEventListener('click', () => {
          match.winner = idx === 0 ? match.a?.name : match.b?.name;
          renderBracket(BRACKET); // re-render to advance
        });
      });
    }

    function renderBracket(data) {
      const root = document.getElementById('knockoutBracket');
      root.innerHTML = '';
      // Compute advancement before render
      computeNextRounds(data);

      const r16 = data[0] || [];         // 8 matches
      const qf  = data[1] || [];         // 4 matches
      const sf  = data[2] || [];         // 2 matches
      const fin = (data[3] && data[3][0]) || { a:{}, b:{} }; // 1 match
      const win = (data[4] && data[4][0]) || { a:{name:'Champion'}, b:{} };

      // Split left/right
      const r16L = r16.slice(0, 4); // A+B
      const r16R = r16.slice(4);    // C+D
      const qfL  = qf.slice(0, 2);
      const qfR  = qf.slice(2);
      const sfL  = sf.slice(0, 1);
      const sfR  = sf.slice(1, 2);

      // Helper to render a column
      const makeCol = (titleText, matches, withGroupHeaders=false) => {
        const col = document.createElement('div');
        col.className = 'round';
        const title = document.createElement('h4');
        title.textContent = titleText;
        col.appendChild(title);
        let prevGroup = '';
        matches.forEach(m => {
          if (withGroupHeaders && m.group && m.group !== prevGroup) {
            const gh = document.createElement('div');
            gh.className = 'group-header';
            gh.textContent = m.group;
            col.appendChild(gh);
            prevGroup = m.group;
          }
          const card = document.createElement('div');
          card.className = 'match';
          card.innerHTML = `
            <div class="seed"><span class="tag">A</span><span class="name">${m.a?.name||''}</span><span class="score">${m.a?.score||''}</span></div>
            <div class="seed"><span class="tag">B</span><span class="name">${m.b?.name||''}</span><span class="score">${m.b?.score||''}</span></div>
          `;
          if (withGroupHeaders && m.group) {
            const badge = document.createElement('span');
            badge.className = 'group-tag';
            badge.textContent = m.group;
            card.appendChild(badge);
          }
          // enable manual pick if no scores
          if (!winnerFromScores(m)) attachClickToPick(card, m);
          col.appendChild(card);
        });
        return col;
      };

      // Build 7 columns: R16(L), QF(L), SF(L), Final+Winner, SF(R), QF(R), R16(R)
      const col0 = makeCol('Groups A/B', r16L, true);
      const col1 = makeCol('Quarterfinals', qfL, false);
      const col2 = makeCol('Semifinal', sfL, false);

      const col3 = document.createElement('div');
      col3.className = 'round';
      const c3title = document.createElement('h4');
      c3title.textContent = 'Final & Winner';
      col3.appendChild(c3title);
      // Final card
      const finalCard = document.createElement('div');
      finalCard.className = 'match';
      finalCard.innerHTML = `
        <div class="seed"><span class="tag">A</span><span class="name">${fin.a?.name||'TBD'}</span><span class="score">${fin.a?.score||''}</span></div>
        <div class="seed"><span class="tag">B</span><span class="name">${fin.b?.name||'TBD'}</span><span class="score">${fin.b?.score||''}</span></div>
      `;
      col3.appendChild(finalCard);
      // Winner card
      const winnerCard = document.createElement('div');
      winnerCard.className = 'match';
      winnerCard.innerHTML = `
        <div class="seed"><span class="tag">🏆</span><span class="name">${win.a?.name||'Champion'}</span></div>
      `;
      col3.appendChild(winnerCard);

      const col4 = makeCol('Semifinal', sfR, false);
      const col5 = makeCol('Quarterfinals', qfR, false);
      const col6 = makeCol('Groups C/D', r16R, true);

      [col0,col1,col2,col3,col4,col5,col6].forEach(c => root.appendChild(c));

      // After DOM ready, draw connectors
      requestAnimationFrame(drawConnectors);
    }

    renderBracket(BRACKET);

    function drawConnectors() {
      const wrap = document.querySelector('.bracket-wrap');
      const svg = document.getElementById('bracketLines');
      if (!wrap || !svg) return;
      const root = document.getElementById('knockoutBracket');
      const cols = Array.from(root.children);
      if (cols.length !== 7) return;
      svg.setAttribute('viewBox', `0 0 ${wrap.clientWidth} ${wrap.clientHeight}`);
      svg.innerHTML = '';

      const getCenters = col => Array.from(col.querySelectorAll('.match')).map(m => {
        const r = m.getBoundingClientRect();
        const w = wrap.getBoundingClientRect();
        return { x: r.left - w.left + r.width, y: r.top - w.top + r.height/2, left: r.left - w.left, rwidth: r.width };
      });

      const src0 = getCenters(cols[0]); // R16 L
      const dst1 = getCenters(cols[1]); // QF L
      const dst2 = getCenters(cols[2]); // SF L
      const src6 = getCenters(cols[6]); // R16 R
      const dst5 = getCenters(cols[5]); // QF R
      const dst4 = getCenters(cols[4]); // SF R
      const cen3 = getCenters(cols[3]); // Final + Winner (first card is final)

      function connect(a, b) {
        if (!a || !b) return;
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        const x1 = a.x, y1 = a.y; const x2 = (b.left), y2 = b.y;
        const mx = (x1 + x2) / 2;
        const d = `M ${x1},${y1} C ${mx},${y1} ${mx},${y2} ${x2},${y2}`;
        path.setAttribute('d', d);
        path.setAttribute('stroke', 'rgba(0,224,255,0.35)');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-width', '1.5');
        svg.appendChild(path);
      }

      // R16 L -> QF L pairings: 0-1->0, 2-3->1
      if (src0.length >= 4 && dst1.length >= 2) {
        connect(src0[0], dst1[0]); connect(src0[1], dst1[0]);
        connect(src0[2], dst1[1]); connect(src0[3], dst1[1]);
      }
      // QF L -> SF L: 0-1->0
      if (dst1.length >= 2 && dst2.length >= 1) { connect(dst1[0], dst2[0]); connect(dst1[1], dst2[0]); }
      // SF L -> Final[0]
      if (dst2.length >= 1 && cen3.length >= 1) connect(dst2[0], cen3[0]);

      // R16 R -> QF R pairings: 0-1->0, 2-3->1 (indices inside their own columns)
      if (src6.length >= 4 && dst5.length >= 2) {
        connect(src6[0], dst5[0]); connect(src6[1], dst5[0]);
        connect(src6[2], dst5[1]); connect(src6[3], dst5[1]);
      }
      // QF R -> SF R: 0-1->0
      if (dst5.length >= 2 && dst4.length >= 1) { connect(dst5[0], dst4[0]); connect(dst5[1], dst4[0]); }
      // SF R -> Final[1]
      if (dst4.length >= 1 && cen3.length >= 1) connect(dst4[0], cen3[0]);
    }

    window.addEventListener('resize', () => requestAnimationFrame(drawConnectors));
    window.addEventListener('scroll', () => requestAnimationFrame(drawConnectors), true);
  </script>

  <script>
    // Generate group brackets from FIXTURES
    const GROUP_BRACKETS = FIXTURES.reduce((acc, match) => {
      if (!acc[match.group]) {
        acc[match.group] = [];
      }
      acc[match.group].push({
        a: { name: match.teamA, score: '' },
        b: { name: match.teamB, score: '' },
        time: match.time,
        day: match.day
      });
      return acc;
    }, {});

    function renderGroups(groups) {
      const root = document.getElementById('groupsBracket');
      root.innerHTML = '';
      Object.keys(groups).forEach(groupName => {
        const col = document.createElement('div');
        col.className = 'group-col';
        const title = document.createElement('h4');
        title.textContent = groupName;
        col.appendChild(title);

        const list = document.createElement('div');
        list.className = 'group-matches';

        groups[groupName].forEach(m => {
          const card = document.createElement('div');
          card.className = 'match';
          card.innerHTML = `
            <div class="fixture-header">
              <span class="fixture-date">${m.day || 'TBD'}</span>
              <span class="fixture-time">${m.time || ''}</span>
            </div>
            <div class="seed"><span class="tag">A</span><span class="name">${m.a.name||''}</span><span class="score">${m.a.score||''}</span></div>
            <div class="seed"><span class="tag">B</span><span class="name">${m.b.name||''}</span><span class="score">${m.b.score||''}</span></div>
          `;
          list.appendChild(card);
        });

        col.appendChild(list);
        root.appendChild(col);
      });
    }

    // renderGroups(GROUP_BRACKETS); // This line is no longer needed as we removed the groups section
  </script>
